spring.application.name=aisearch

spring.datasource.url=jdbc:postgresql://localhost:5432/aisearch
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

gemini.api.key=${GEMINI_API_KEY}

gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent

gemini.chat.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:3000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:15000}

app.upload.max-file-size-bytes=${APP_MAX_UPLOAD_BYTES:10485760}
app.document.max-content-chars=${APP_MAX_DOCUMENT_CHARS:5000000}
app.document.max-pdf-pages=${APP_MAX_PDF_PAGES:500}
app.document.max-chunks=${APP_MAX_DOCUMENT_CHUNKS:10000}
app.document.chunk-size=${APP_DOCUMENT_CHUNK_SIZE:850}
app.document.chunk-overlap=${APP_DOCUMENT_CHUNK_OVERLAP:120}
app.rag.retrieval-candidate-limit=${APP_RAG_RETRIEVAL_CANDIDATE_LIMIT:20}
app.rag.final-context-limit=${APP_RAG_FINAL_CONTEXT_LIMIT:6}
app.rag.similarity-threshold=${APP_RAG_SIMILARITY_THRESHOLD:0.65}
app.rag.max-chunks-per-document=${APP_RAG_MAX_CHUNKS_PER_DOCUMENT:3}
app.rag.web-fallback-enabled=${APP_RAG_WEB_FALLBACK_ENABLED:false}
app.rag.web-result-limit=${APP_RAG_WEB_RESULT_LIMIT:5}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.oauth.secure-cookie=${APP_OAUTH_SECURE_COOKIE:false}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:10MB}

spring.profiles.include=local

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
